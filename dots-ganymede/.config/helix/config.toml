theme = "ayu_dark"

[editor]
true-color = true
line-number = "relative"
cursorline = true
color-modes = true
bufferline = "multiple"
rulers = [100]
end-of-line-diagnostics = "hint"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[editor.file-picker]
hidden = false

[editor.inline-diagnostics]
cursor-line = "warning"
